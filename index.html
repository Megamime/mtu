<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#050507"/>
<title>MangaVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{
  --black:#050507;--black4:#14141f;--line:#1e1e2e;
  --purple:#7c3aed;--purple2:#8b5cf6;--purple3:#a78bfa;--purple4:#c4b5fd;
  --text:#e8e4f5;--text3:#4e4a6a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--black);}
body{
  color:var(--text);font-family:'Outfit',sans-serif;
  display:flex;align-items:center;justify-content:center;
  height:100dvh;position:relative;
}

.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);animation:drift ease-in-out infinite alternate;}
.orb1{width:420px;height:420px;top:-140px;left:-120px;background:radial-gradient(ellipse,rgba(124,58,237,0.16) 0%,transparent 70%);animation-duration:9s;}
.orb2{width:320px;height:320px;bottom:-100px;right:-80px;background:radial-gradient(ellipse,rgba(139,92,246,0.1) 0%,transparent 70%);animation-duration:11s;animation-direction:alternate-reverse;}
@keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(30px,20px) scale(1.08);}}

.pages{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  10%{opacity:1;}
  90%{opacity:.55;}
  100%{transform:translateY(-115vh) rotate(160deg);opacity:0;}
}
.p-page{position:absolute;bottom:-40px;border-radius:2px;background:linear-gradient(160deg,rgba(167,139,250,.28),rgba(124,58,237,.08));border:1px solid rgba(167,139,250,.22);animation:floatUp linear infinite;}
.p-diamond{position:absolute;bottom:-40px;background:linear-gradient(160deg,rgba(196,181,253,.3),rgba(124,58,237,.05));border:1px solid rgba(196,181,253,.25);transform:rotate(45deg);animation:floatUp linear infinite;}
.p-dust{position:absolute;bottom:-40px;border-radius:50%;background:#c4b5fd;box-shadow:0 0 6px rgba(196,181,253,.8);animation:floatUp linear infinite;}
.p-shape{position:absolute;bottom:-40px;color:#a78bfa;animation:floatUp linear infinite;filter:drop-shadow(0 0 3px rgba(167,139,250,.5));}

.stage{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;}

.mark-wrap{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;}
.mark-halo{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.4) 0%,transparent 68%);
  animation:halo 2.2s ease-in-out infinite;
}
@keyframes halo{0%,100%{transform:scale(.85);opacity:.6;}50%{transform:scale(1.15);opacity:1;}}
.mark{
  position:relative;width:64px;height:64px;border-radius:20px;
  background:linear-gradient(155deg,var(--purple2),var(--purple));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 26px rgba(124,58,237,.55),0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);
  animation:markPulse 2.2s ease-in-out infinite;
}
@keyframes markPulse{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.045) rotate(-1.2deg);}}
.mark svg{overflow:visible;}
.mark svg path{
  stroke-dasharray:60;
  stroke-dashoffset:60;
  animation:draw 1.3s ease forwards .15s;
}
@keyframes draw{to{stroke-dashoffset:0;}}

.wordmark{text-align:center;opacity:0;animation:riseIn .7s cubic-bezier(.2,.9,.25,1) forwards .35s;margin-top:18px;}
@keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.wordmark h1{
  font-family:'Playfair Display',serif;font-weight:700;
  font-size:24px;letter-spacing:.3px;
  background:linear-gradient(120deg,var(--text) 40%,var(--purple3) 60%,var(--text) 80%);
  background-size:220% auto;background-clip:text;-webkit-background-clip:text;color:transparent;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{to{background-position:-220% center;}}
.wordmark p{
  margin-top:6px;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--text3);font-weight:600;
}

.loadbar-wrap{width:140px;opacity:0;animation:riseIn .6s ease forwards .55s;margin-top:18px;}
.loadbar-track{
  width:100%;height:3px;border-radius:3px;background:var(--black4);
  border:1px solid var(--line);overflow:hidden;position:relative;
}
.loadbar-fill{
  position:absolute;inset:0;width:40%;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--purple2),var(--purple4),var(--purple2),transparent);
  animation:loadSweep 1.15s ease-in-out infinite;
}
@keyframes loadSweep{
  0%{transform:translateX(-120%);}
  100%{transform:translateX(340%);}
}
.loadlabel{
  margin-top:8px;text-align:center;font-size:10px;color:var(--text3);
  font-weight:500;letter-spacing:.4px;
}
.loadlabel span{color:var(--purple3);font-variant-numeric:tabular-nums;font-weight:600;}

.welcome{
  font-family:'Playfair Display',serif;font-weight:700;font-size:30px;color:#f4f2fb;
  margin-top:22px;opacity:0;animation:fadeUp .55s ease forwards .35s;
  text-shadow:0 0 24px rgba(124,58,237,.35);text-align:center;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

@media (prefers-reduced-motion: reduce){
  .orb,.p-page,.p-diamond,.p-dust,.p-shape,.mark,.mark-halo,.wordmark h1,.loadbar-fill{animation:none !important;}
}
</style>
</head>
<body>

<div class="aurora">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
</div>
<div class="pages" id="pages"></div>

<div class="stage">
  <div class="mark-wrap">
    <div class="mark-halo"></div>
    <div class="mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
  </div>
  <div class="wordmark">
    <h1>MangaVault</h1>
    <p>Kütüphanen Açılıyor</p>
  </div>
  <div class="loadbar-wrap">
    <div class="loadbar-track"><div class="loadbar-fill"></div></div>
    <div class="loadlabel"><span id="pct">0</span>%</div>
  </div>
  <div class="welcome">Hoş geldin!</div>
</div>

<script>
  var pagesEl = document.getElementById('pages');

  function starPath(spikes, innerRatio){
    var outerR = 12, innerR = 12 * innerRatio;
    var pts = [];
    for(var i = 0; i < spikes * 2; i++){
      var r = i % 2 === 0 ? outerR : innerR;
      var a = (Math.PI / spikes) * i - Math.PI / 2;
      pts.push((12 + r * Math.cos(a)).toFixed(2) + ',' + (12 + r * Math.sin(a)).toFixed(2));
    }
    return pts.join(' ');
  }
  var star4 = starPath(4, 0.42);
  var star5 = starPath(5, 0.5);

  var shapeSVGs = [
    '<svg width="SZ" height="SZ" viewBox="0 0 24 24" fill="currentColor"><polygon points="' + star4 + '"/></svg>',
    '<svg width="SZ" height="SZ" viewBox="0 0 24 24" fill="currentColor"><polygon points="' + star5 + '"/></svg>',
    '<svg width="SZ" height="SZ" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    '<svg width="SZ" height="SZ" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="22" y2="12"/></svg>'
  ];

  var kinds = ['page','diamond','dust','shape'];
  var N = 24;
  for(var i = 0; i < N; i++){
    var kind = kinds[Math.floor(Math.random() * kinds.length)];
    var p = document.createElement('div');
    var dur = (3 + Math.random() * 3.5) + 's';
    var delay = (Math.random() * 5) + 's';
    var left = (Math.random() * 100) + 'vw';

    if(kind === 'page'){
      p.className = 'p-page';
      var w = 6 + Math.random() * 4, h = w * 1.35;
      p.style.width = w + 'px'; p.style.height = h + 'px';
    } else if(kind === 'diamond'){
      p.className = 'p-diamond';
      var s1 = 6 + Math.random() * 4;
      p.style.width = s1 + 'px'; p.style.height = s1 + 'px';
    } else if(kind === 'dust'){
      p.className = 'p-dust';
      var s2 = 2 + Math.random() * 2.5;
      p.style.width = s2 + 'px'; p.style.height = s2 + 'px';
    } else {
      p.className = 'p-shape';
      var s3 = 15 + Math.random() * 7;
      var svgTemplate = shapeSVGs[Math.floor(Math.random() * shapeSVGs.length)];
      p.innerHTML = svgTemplate.replace(/SZ/g, s3);
    }

    p.style.left = left;
    p.style.animationDuration = dur;
    p.style.animationDelay = delay;
    p.style.opacity = (0.4 + Math.random() * 0.5);
    pagesEl.appendChild(p);
  }

  var pctEl = document.getElementById('pct');
  var pct = 0;
  var target = 100;
  var start = performance.now();
  var DURATION = 620;
  function tick(now){
    var t = Math.min(1, (now - start) / DURATION);
    pct = Math.round((1 - Math.pow(1 - t, 2)) * target);
    pctEl.textContent = pct;
    if(t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
  var dest = mobile ? 'mobile.html' : 'desktop.html';
  setTimeout(function(){ window.location.replace(dest); }, 650);
</script>
</body>
</html>
